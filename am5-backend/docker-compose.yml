version: '3.8'

services:
  backend:
    build: .
    container_name: am5_backend
    restart: always
    network_mode: "host" # Allows connecting to Host's PostgreSQL via localhost:5432
    env_file:
      - .env
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  redis:
    image: redis:alpine
    container_name: am5_redis
    restart: always
    ports:
      - "6379:6379"
