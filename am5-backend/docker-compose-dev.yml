version: '3.8'

services:
  backend:
    build: .
    container_name: am5_backend_dev
    restart: always
    network_mode: "host" # Allows connecting to Host's PostgreSQL via localhost:5433
    env_file:
      - .env
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001

  redis:
    image: redis:alpine
    container_name: am5_redis_dev
    restart: always
    ports:
      - "6380:6379"
